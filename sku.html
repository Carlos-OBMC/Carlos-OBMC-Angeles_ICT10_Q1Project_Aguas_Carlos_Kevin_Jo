<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SKU Generator</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.4/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.2.4/core.js"></script>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #171717;
        }

        .navbar {
            height: 70px;
            background-color: #111111;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 30px;
        }

        .logo {
            color: #ffcc00;
            font-size: 32px;
            font-weight: bold;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            margin-left: 15px;
        }

        .links {
            margin-left: auto;
        }

        .links a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
        }

        .links a:hover {
            color: #ffcc00;
        }

        .box {
            width: 500px;
            margin: 50px auto;
            background-color: white;
            border-radius: 15px;
            padding: 30px;
        }

        h1 {
            color: #d92316;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background-color: #d92316;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #b91d13;
        }

        #sku_result {
            margin-top: 25px;
            padding: 20px;
            background-color: #f2f2f2;
            text-align: center;
            border-radius: 10px;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">M</div>

        <div class="brand">McDonald's</div>

        <div class="links">
            <a href="index.html">🧾 Receipt Generator</a>
            <a href="sku.html">▥ SKU Generator</a>
        </div>

    </div>

    <div class="box">

        <h1>McDonald's SKU Generator</h1>

        <label>Product Category</label>

        <select id="category">
            <option value="BG">Burger</option>
            <option value="CH">Chicken</option>
            <option value="FR">Fries</option>
            <option value="DS">Dessert</option>
            <option value="DR">Drink</option>
        </select>

        <label>Product Name</label>

        <input type="text" id="product" placeholder="Example: Big Mac">

        <label>Stock Quantity</label>

        <input type="number" id="stock" placeholder="Example: 25">

        <button py-click="generate_sku">
            Generate SKU
        </button>

        <div id="sku_result">
            Your SKU will appear here.
        </div>

    </div>

    <script type="py" src="./main.py"></script>

</body>

</html>
